<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" style="background:#0d1117;font-family:system-ui,sans-serif">
  <defs>
    <style>
      .node-label { fill:#e6edf3; font-size:13px; font-weight:600; }
      .node-sub   { fill:#8b949e; font-size:11px; }
      .model-label{ fill:#8b949e; font-size:10px; }
      .header     { fill:#e6edf3; font-size:15px; font-weight:700; }
      .header-sub { fill:#58a6ff; font-size:12px; }
      .edge       { stroke:#30363d; stroke-width:1.5; fill:none; stroke-dasharray:6,4; }
      .edge-pulse { stroke:#58a6ff; stroke-width:1; fill:none; stroke-dasharray:4,20; opacity:0.6; }
      .status-ok  { fill:#3fb950; }
      .status-peer{ fill:#58a6ff; }
      .status-dim { fill:#388bfd; opacity:0.6; }

      /* Node pulse */
      @keyframes pulse-server { 0%,100%{r:52} 50%{r:55} }
      @keyframes pulse-desk   { 0%,100%{r:44} 50%{r:47} }
      @keyframes pulse-laptop { 0%,100%{r:36;opacity:.7} 50%{r:38;opacity:.85} }

      /* Status dot pulse */
      @keyframes dot-pulse { 0%,100%{opacity:1;r:5} 50%{opacity:.4;r:6} }

      /* Orbit animations */
      @keyframes orbit-a  { from{transform:rotate(0deg)  translateX(75px) rotate(0deg)  } to{transform:rotate(360deg) translateX(75px) rotate(-360deg)} }
      @keyframes orbit-b  { from{transform:rotate(60deg) translateX(75px) rotate(-60deg)} to{transform:rotate(420deg) translateX(75px) rotate(-420deg)} }
      @keyframes orbit-c  { from{transform:rotate(120deg)translateX(75px) rotate(-120deg)}to{transform:rotate(480deg) translateX(75px) rotate(-480deg)} }
      @keyframes orbit-d  { from{transform:rotate(180deg)translateX(75px) rotate(-180deg)}to{transform:rotate(540deg) translateX(75px) rotate(-540deg)} }
      @keyframes orbit-e  { from{transform:rotate(240deg)translateX(75px) rotate(-240deg)}to{transform:rotate(600deg) translateX(75px) rotate(-600deg)} }
      @keyframes orbit-f  { from{transform:rotate(300deg)translateX(75px) rotate(-300deg)}to{transform:rotate(660deg) translateX(75px) rotate(-660deg)} }

      @keyframes orbit-sm-a { from{transform:rotate(0deg)  translateX(60px) rotate(0deg)  } to{transform:rotate(360deg) translateX(60px) rotate(-360deg)} }
      @keyframes orbit-sm-b { from{transform:rotate(120deg)translateX(60px) rotate(-120deg)}to{transform:rotate(480deg) translateX(60px) rotate(-480deg)} }
      @keyframes orbit-sm-c { from{transform:rotate(240deg)translateX(60px) rotate(-240deg)}to{transform:rotate(600deg) translateX(60px) rotate(-600deg)} }

      @keyframes orbit-xs-a { from{transform:rotate(0deg)  translateX(48px) rotate(0deg)  } to{transform:rotate(360deg) translateX(48px) rotate(-360deg)} }
      @keyframes orbit-xs-b { from{transform:rotate(180deg)translateX(48px) rotate(-180deg)}to{transform:rotate(540deg) translateX(48px) rotate(-540deg)} }

      /* Edge data-flow */
      @keyframes flow { from{stroke-dashoffset:60} to{stroke-dashoffset:0} }

      /* Sync indicator */
      @keyframes sync-flash { 0%,90%,100%{opacity:0} 92%,98%{opacity:1} }
    </style>

    <!-- Glow filter for local node -->
    <filter id="glow-green" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-blue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ─── Background panel ─────────────────────────────────────────────────── -->
  <rect width="900" height="500" fill="#0d1117" rx="12"/>
  <rect x="1" y="1" width="898" height="498" fill="none" stroke="#21262d" stroke-width="1" rx="12"/>

  <!-- ─── Header ────────────────────────────────────────────────────────────── -->
  <circle cx="28" cy="26" r="6" class="status-ok" style="animation:dot-pulse 2s infinite"/>
  <text x="42" y="31" class="header">Apostle Cluster</text>
  <text x="178" y="31" class="header-sub">· 3 nodes · 22 models · all healthy</text>

  <!-- live indicator -->
  <circle cx="855" cy="22" r="5" fill="#3fb950" style="animation:dot-pulse 1.5s infinite"/>
  <text x="866" y="27" fill="#3fb950" font-size="11">live</text>

  <!-- ─── Edges ──────────────────────────────────────────────────────────────── -->
  <!-- server ↔ workstation -->
  <line x1="290" y1="200" x2="530" y2="175" class="edge"/>
  <line x1="290" y1="200" x2="530" y2="175" class="edge-pulse" style="animation:flow 2s linear infinite"/>

  <!-- server ↔ laptop -->
  <line x1="290" y1="200" x2="430" y2="370" class="edge"/>
  <line x1="290" y1="200" x2="430" y2="370" class="edge-pulse" style="animation:flow 2.8s linear infinite 0.4s"/>

  <!-- workstation ↔ laptop -->
  <line x1="530" y1="175" x2="430" y2="370" class="edge"/>
  <line x1="530" y1="175" x2="430" y2="370" class="edge-pulse" style="animation:flow 3.2s linear infinite 1.1s"/>

  <!-- ─── SERVER-NODE (local, green) ────────────────────────────────────────── -->
  <g transform="translate(290,200)">
    <!-- Orbit ring hint -->
    <circle r="75" fill="none" stroke="#1a2030" stroke-width="1" stroke-dasharray="2,4"/>

    <!-- Host circle -->
    <circle r="52" fill="#0d1117" stroke="#3fb950" stroke-width="2" filter="url(#glow-green)"
            style="animation:pulse-server 3s ease-in-out infinite"/>

    <!-- Model satellites -->
    <g style="animation:orbit-a 12s linear infinite"><circle cx="0" cy="0" r="7" fill="#238636" stroke="#2ea043" stroke-width="1"/></g>
    <g style="animation:orbit-b 12s linear infinite"><circle cx="0" cy="0" r="7" fill="#238636" stroke="#2ea043" stroke-width="1"/></g>
    <g style="animation:orbit-c 12s linear infinite"><circle cx="0" cy="0" r="6" fill="#1f6feb" stroke="#388bfd" stroke-width="1"/></g>
    <g style="animation:orbit-d 12s linear infinite"><circle cx="0" cy="0" r="6" fill="#1f6feb" stroke="#388bfd" stroke-width="1"/></g>
    <g style="animation:orbit-e 12s linear infinite"><circle cx="0" cy="0" r="5" fill="#6e40c9" stroke="#8957e5" stroke-width="1"/></g>
    <g style="animation:orbit-f 12s linear infinite"><circle cx="0" cy="0" r="5" fill="#6e40c9" stroke="#8957e5" stroke-width="1"/></g>

    <!-- Status dot -->
    <circle cx="37" cy="-37" r="5" class="status-ok" style="animation:dot-pulse 2s infinite"/>

    <!-- Labels -->
    <text y="-8" text-anchor="middle" class="node-label">server-node</text>
    <text y="8" text-anchor="middle" class="node-sub">32 GB · Arc GPU</text>
    <text y="23" text-anchor="middle" class="node-sub">12 models</text>

    <!-- LOCAL badge -->
    <rect x="-24" y="32" width="48" height="16" rx="8" fill="#1a4929"/>
    <text y="44" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="600">local</text>
  </g>

  <!-- ─── WORKSTATION (peer, blue) ────────────────────────────────────────── -->
  <g transform="translate(530,175)">
    <circle r="60" fill="none" stroke="#1a2030" stroke-width="1" stroke-dasharray="2,4"/>

    <circle r="44" fill="#0d1117" stroke="#388bfd" stroke-width="2" filter="url(#glow-blue)"
            style="animation:pulse-desk 4s ease-in-out infinite 0.5s"/>

    <g style="animation:orbit-sm-a 16s linear infinite"><circle cx="0" cy="0" r="7" fill="#1f6feb" stroke="#388bfd" stroke-width="1"/></g>
    <g style="animation:orbit-sm-b 16s linear infinite"><circle cx="0" cy="0" r="7" fill="#1f6feb" stroke="#388bfd" stroke-width="1"/></g>
    <g style="animation:orbit-sm-c 16s linear infinite"><circle cx="0" cy="0" r="6" fill="#238636" stroke="#2ea043" stroke-width="1"/></g>

    <circle cx="31" cy="-31" r="5" class="status-peer" style="animation:dot-pulse 2.4s infinite 0.3s"/>

    <text y="-6" text-anchor="middle" class="node-label">workstation</text>
    <text y="9" text-anchor="middle" class="node-sub">16 GB · NVIDIA</text>
    <text y="24" text-anchor="middle" class="node-sub">7 models</text>
  </g>

  <!-- ─── LAPTOP (peer, dim — intermittent) ─────────────────────────────── -->
  <g transform="translate(430,370)">
    <circle r="48" fill="none" stroke="#0d1929" stroke-width="1" stroke-dasharray="2,4"/>

    <circle r="36" fill="#0d1117" stroke="#388bfd" stroke-width="1.5" opacity="0.75"
            style="animation:pulse-laptop 5s ease-in-out infinite 1s"/>

    <g style="animation:orbit-xs-a 20s linear infinite"><circle cx="0" cy="0" r="6" fill="#1f6feb" stroke="#388bfd" stroke-width="1" opacity="0.7"/></g>
    <g style="animation:orbit-xs-b 20s linear infinite"><circle cx="0" cy="0" r="5" fill="#238636" stroke="#2ea043" stroke-width="1" opacity="0.7"/></g>

    <circle cx="26" cy="-26" r="5" class="status-dim" style="animation:dot-pulse 3s infinite 0.7s"/>

    <text y="-5" text-anchor="middle" class="node-label" opacity="0.8">laptop</text>
    <text y="9" text-anchor="middle" class="node-sub" opacity="0.7">8 GB · CPU</text>
    <text y="24" text-anchor="middle" class="node-sub" opacity="0.7">3 models</text>
  </g>

  <!-- ─── Legend ────────────────────────────────────────────────────────────── -->
  <g transform="translate(680,310)">
    <rect width="190" height="148" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <text x="14" y="22" fill="#8b949e" font-size="11" font-weight="600" text-transform="uppercase">Model types</text>

    <circle cx="24" cy="44" r="6" fill="#238636" stroke="#2ea043" stroke-width="1"/>
    <text x="36" y="49" fill="#c9d1d9" font-size="11">General / reasoning</text>

    <circle cx="24" cy="68" r="6" fill="#1f6feb" stroke="#388bfd" stroke-width="1"/>
    <text x="36" y="73" fill="#c9d1d9" font-size="11">Code / tool-use</text>

    <circle cx="24" cy="92" r="6" fill="#6e40c9" stroke="#8957e5" stroke-width="1"/>
    <text x="36" y="97" fill="#c9d1d9" font-size="11">Embeddings</text>

    <line x1="14" y1="112" x2="34" y2="112" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="40" y="117" fill="#c9d1d9" font-size="11">Peer connection</text>

    <circle cx="24" cy="133" r="5" fill="#3fb950"/>
    <text x="36" y="138" fill="#c9d1d9" font-size="11">Node healthy</text>
  </g>

  <!-- ─── Sync activity flash ───────────────────────────────────────────────── -->
  <g style="animation:sync-flash 8s ease-in-out infinite 2s">
    <rect x="680" y="60" width="190" height="48" rx="8" fill="#1a2d1a" stroke="#2ea043" stroke-width="1"/>
    <text x="695" y="80" fill="#3fb950" font-size="11" font-weight="600">⟳ Syncing model</text>
    <text x="695" y="98" fill="#8b949e" font-size="10">deepseek-r1:14b → workstation</text>
  </g>

  <g style="animation:sync-flash 8s ease-in-out infinite 6s">
    <rect x="680" y="60" width="190" height="48" rx="8" fill="#1a1a2d" stroke="#388bfd" stroke-width="1"/>
    <text x="695" y="80" fill="#58a6ff" font-size="11" font-weight="600">⟳ Routing request</text>
    <text x="695" y="98" fill="#8b949e" font-size="10">code query → server-node</text>
  </g>

  <!-- ─── Footer ────────────────────────────────────────────────────────────── -->
  <text x="450" y="488" text-anchor="middle" fill="#484f58" font-size="10">
    Simulated cluster view · growlf/ai-stack · apostle serve
  </text>
</svg>
