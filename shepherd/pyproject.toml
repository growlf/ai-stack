[project]
name = "shepherd"
version = "0.1.0"
description = "Herd observability for ai-stack — watches over the Ollama federation"
authors = [{name = "Vela + ai-stack team"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "httpx>=0.27",
    "psutil>=5.9",
    "python-multipart>=0.0.9",
]

[project.scripts]
shepherd-node = "shepherd_node.__main__:main"
shepherd-control = "shepherd_control.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shepherd_node*", "shepherd_control*"]
