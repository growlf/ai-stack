# litellm_config.yaml — LiteLLM proxy configuration
# Docs: https://docs.litellm.ai/docs/proxy/configs

model_list:
  # ── Anthropic / Claude ──────────────────────────────────────────────────
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      supports_function_calling: true

  - model_name: claude-opus-4-6
    litellm_params:
      model: anthropic/claude-opus-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      supports_function_calling: true

  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      supports_function_calling: true

  # ── Google / Gemini ─────────────────────────────────────────────────────
  - model_name: gemini-2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro-preview-03-25
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      supports_function_calling: true

  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash-preview-04-17
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      supports_function_calling: true

  - model_name: gemini-2.0-flash
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      supports_function_calling: true

  # ── OpenAI (optional) ───────────────────────────────────────────────────
  # - model_name: gpt-4o
  #   litellm_params:
  #     model: openai/gpt-4o
  #     api_key: os.environ/OPENAI_API_KEY
  #   model_info:
  #     supports_function_calling: true

  # ── Local cluster via Olla (load-balanced across all nodes) ─────────────
  # Olla speaks OpenAI-compatible API — use openai/ prefix, not ollama/.
  - model_name: qwen2.5-coder:14b
    litellm_params:
      model: openai/qwen2.5-coder:14b
      api_base: http://olla:40114
      api_key: "none"
    model_info:
      supports_function_calling: true

  - model_name: qwen2.5:14b
    litellm_params:
      model: openai/qwen2.5:14b
      api_base: http://olla:40114
      api_key: "none"
    model_info:
      supports_function_calling: true

  - model_name: qwen3.5:27b
    litellm_params:
      model: openai/qwen3.5:27b
      api_base: http://olla:40114
      api_key: "none"
    model_info:
      supports_function_calling: true

  - model_name: deepseek-r1:14b
    litellm_params:
      model: openai/deepseek-r1:14b
      api_base: http://olla:40114
      api_key: "none"
    model_info:
      supports_function_calling: false

  - model_name: gemma3:12b
    litellm_params:
      model: openai/gemma3:12b
      api_base: http://olla:40114
      api_key: "none"
    model_info:
      supports_function_calling: false

  - model_name: nomic-embed-text
    litellm_params:
      model: openai/nomic-embed-text
      api_base: http://olla:40114
      api_key: "none"
    model_info:
      supports_function_calling: false
      mode: embedding

litellm_settings:
  drop_params: true
  modify_params: true        # fixes Anthropic tool-history errors
  detailed_debug: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
