###############################################################################
# AI Stack — with Intel Arc iGPU + cloud models + LiteLLM, unified in Open WebUI
#
# Topology:
#
#   Open WebUI  ──[Ollama endpoint]──▶  Olla :40114  ──▶  ollama-arc :11434  (Intel Arc iGPU)
#               ──[OpenAI endpoint]─┐                 ──▶  [remote-node] :11434  (LAN, optional)
#                                   └──────────────────▶  LiteLLM :4000
#                                                               ├─ Claude  (Anthropic)
#                                                               └─ Gemini  (Google)
#
#   Khoj  ──▶  Olla :40114/olla/ollama  (RAG + semantic search over Obsidian vault)
#   Pipelines ──▶  Open WebUI  (function pipelines)
#   Open Terminal ──▶  Open WebUI  (browser shell)
#
# Quick start:
#   1. cp .env.example .env && nano .env
#   2. ./check-arc-gpu.sh          # validate GPU_CARD / GPU_RENDER device paths
#   3. docker compose up -d
#
# Service URLs:
#   Open WebUI    http://localhost:3000
#   LiteLLM UI    http://localhost:4000/ui      (admin / LITELLM_MASTER_KEY)
#   Olla status   http://localhost:40114/internal/status/endpoints
#   Khoj          http://localhost:42110
#   Pipelines     http://localhost:9099
#   Open Terminal http://localhost:8000
###############################################################################

services:

  # ─── Ollama (Intel Arc iGPU) ───────────────────────────────────────────────
  # Uses ava-agentone/ollama-intel: community-maintained, iGPU-first
  # Replaces intelanalytics/ipex-llm-inference-cpp-xpu (archived Jan 28, 2026)
  # Source: https://github.com/Ava-AgentOne/ollama-intel
  ollama-arc:
    image: ghcr.io/ava-agentone/ollama-intel:latest
    container_name: ollama-arc
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=app://obsidian.md*
      - OLLAMA_DEBUG=1
      - DEVICE=Arc
      - OLLAMA_INTEL_GPU=true
      - ONEAPI_DEVICE_SELECTOR=level_zero:0
      - ZES_ENABLE_SYSMAN=1
      - OLLAMA_KEEP_ALIVE=-1
    volumes:
      - ${OLLAMA_DATA:-/home/user/.ollama}:/root/.ollama
      - ${OLLAMA_SSH_KEY:-/dev/null}:/root/.ollama/id_ed25519:ro
      - ${OLLAMA_SSH_KEY_PUB:-/dev/null}:/root/.ollama/id_ed25519.pub:ro
    devices:
      # GPU card node — may be card0 or card1 depending on boot
      # check-arc-gpu.sh validates this before stack starts
      - ${GPU_CARD:-/dev/dri/card1}:${GPU_CARD:-/dev/dri/card1}
      - ${GPU_RENDER:-/dev/dri/renderD128}:${GPU_RENDER:-/dev/dri/renderD128}
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    shm_size: '16gb'
    mem_limit: 32g
    networks:
      - ai-net

  # ─── LiteLLM — cloud API gateway ──────────────────────────────────────────
  # Exposes Claude, Gemini (and optionally OpenAI) via a single
  # OpenAI-compatible endpoint. Olla routes cloud model requests here.
  # Admin UI: http://localhost:4000/ui
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    restart: unless-stopped
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./proxy/litellm_config.yaml:/app/config.yaml:ro
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-not-set}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-local-admin}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health/liveliness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - ai-net

  # ─── Olla — LLM proxy & load balancer ─────────────────────────────────────
  # Single unified endpoint for all models — local Arc GPU + cloud via LiteLLM.
  # LAN node config is NOT baked in here — it lives in .env (OLLAMA_NODES).
  # Run ./start.sh instead of docker compose up directly; it generates
  # olla.yaml from your .env before bringing up the stack.
  # Status: http://localhost:40114/internal/status/endpoints
  olla:
    image: ghcr.io/thushan/olla:latest
    container_name: olla
    restart: unless-stopped
    ports:
      - "${OLLA_PORT:-40114}:40114"
    volumes:
      - ./proxy/olla.yaml:/app/config.yaml:ro   # generated by start.sh — in .gitignore
      - olla-logs:/app/logs
    depends_on:
      - ollama-arc
      - litellm
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:40114/internal/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ai-net

  # ─── Open WebUI ────────────────────────────────────────────────────────────
  # Ollama endpoint → Olla (local models, load balanced)
  # OpenAI endpoint → LiteLLM (Claude, Gemini — all appear in model picker)
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: always
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    environment:
      # Local models via Olla (replaces direct ollama-arc reference)
      - OLLAMA_BASE_URL=http://olla:40114/olla/ollama
      # Cloud models via LiteLLM
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY:-sk-local-admin}
      # Open Terminal integration
      - OPEN_TERMINAL_URL=http://open-terminal:8000
      - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY:-changeme}
      # Pipelines integration
      - PIPELINES_URLS=http://pipelines:9099
      - PIPELINES_API_KEY=${PIPELINES_API_KEY:-changeme}
      # UI settings
      - WEBUI_NAME=${WEBUI_NAME:-Yeti's AI Stack}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-changeme}
      - DEFAULT_USER_ROLE=user
      - ENABLE_SIGNUP=true
    volumes:
      - open-webui:/app/backend/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - olla
      - litellm
      - pipelines
    networks:
      - ai-net

  # ─── Open Terminal ─────────────────────────────────────────────────────────
  open-terminal:
    image: ghcr.io/open-webui/open-terminal:latest
    container_name: open-terminal
    restart: unless-stopped
    ports:
      - "${TERMINAL_PORT:-8000}:8000"
    environment:
      - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY:-changeme}
      - TERMINAL_SUDO_ENABLED=true
      - TERMINAL_USER=${STACK_USER:-user}
    volumes:
      - open-terminal-data:/home/user
    networks:
      - ai-net

  # ─── Pipelines ─────────────────────────────────────────────────────────────
  pipelines:
    image: ghcr.io/open-webui/pipelines:main
    container_name: pipelines
    restart: always
    ports:
      - "${PIPELINES_PORT:-9099}:9099"
    environment:
      - PIPELINES_API_KEY=${PIPELINES_API_KEY:-changeme}
    volumes:
      - pipelines:/app/pipelines
    networks:
      - ai-net

  # ─── Khoj — AI second brain + Obsidian RAG ─────────────────────────────────
  # Indexes your Obsidian vault for semantic search + RAG over local notes.
  # Routes inference through Olla so it benefits from load balancing/failover.
  # Obsidian plugin setup: see docs/khoj-setup.md
  khoj-db:
    image: ankane/pgvector:latest
    container_name: khoj-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: khoj
      POSTGRES_PASSWORD: ${KHOJ_DB_PASSWORD:-khojpassword}
      POSTGRES_DB: khoj
    volumes:
      - khoj-db:/var/lib/postgresql/data
    networks:
      - ai-net

  khoj:
    image: ghcr.io/khoj-ai/khoj:latest
    container_name: khoj
    restart: unless-stopped
    ports:
      - "${KHOJ_PORT:-42110}:42110"
    environment:
      - KHOJ_ADMIN_EMAIL=${KHOJ_ADMIN_EMAIL:-admin@localhost}
      - KHOJ_ADMIN_PASSWORD=${KHOJ_ADMIN_PASSWORD:-changeme}
      - KHOJ_DJANGO_SECRET_KEY=${KHOJ_DJANGO_SECRET_KEY:-changeme-secret-key}
      - POSTGRES_USER=khoj
      - POSTGRES_PASSWORD=${KHOJ_DB_PASSWORD:-khojpassword}
      - POSTGRES_DB=khoj
      - POSTGRES_HOST=khoj-db
      - POSTGRES_PORT=5432
      # Route inference through Olla instead of directly to ollama-arc.
      # Khoj now benefits from load balancing + failover automatically.
      - OPENAI_BASE_URL=http://olla:40114/olla/ollama/v1/
      # nomic-embed-text is already in the recommended model stack
      - EMBEDDING_MODEL=nomic-embed-text
      # Disable auth for local-only access; enable with reverse proxy in production
      - KHOJ_NO_AUTH=true
    command: --host="0.0.0.0" --port=42110 --anonymous-mode --non-interactive
    volumes:
      # Mount your Obsidian vault read-only for indexing
      - ${OBSIDIAN_VAULT_PATH:-/home/user/obsidian}:/vault:ro
    depends_on:
      - khoj-db
      - olla
    networks:
      - ai-net

  # ─── Khoj Sync (CouchDB → Khoj live indexing) ─────────────────────────────
  # Watches CouchDB _changes feed and pushes updated notes to Khoj in real-time.
  # Handles LiveSync's chunked storage format automatically.
  # khoj-sync:
  #   build:
  #     context: ./khoj-sync
  #   container_name: khoj-sync
  #   restart: unless-stopped
  #   environment:
  #     - COUCHDB_URL=${COUCHDB_URL}
  #     - COUCHDB_DB=${COUCHDB_DB:-yeti-journal}
  #     - COUCHDB_USER=${COUCHDB_USER}
  #     - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
  #     - KHOJ_URL=http://khoj:42110
  #     - LOG_LEVEL=${KHOJ_SYNC_LOG_LEVEL:-INFO}
  #     - KHOJ_SYNC_SKIP_INITIAL=${KHOJ_SYNC_SKIP_INITIAL:-false}
  #   networks:
  #     - ai-net
  #   depends_on:
  #     - khoj

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  open-webui:
    external: true          # pre-existing — preserves your WebUI config/history
  open-terminal-data:
  pipelines:
  khoj-db:
  olla-logs:

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  ai-net: