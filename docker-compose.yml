###############################################################################
# AI Stack — local LLMs + cloud models + LiteLLM, unified via Olla router
#
# Topology:
#
#   Retriever  ──[embed]──▶  Olla :40114  ──▶  ollama :11434  (local LLM)
#   OpenCode   ──[tool / provider]──▶  Olla :40114
#               ──[provider]───────▶  LiteLLM :4000  ──▶  Claude (Anthropic)
#                                                       ──▶  Gemini (Google)
#
#   All inference through Olla for unified routing + load balancing.
#   OpenCode is the primary AI interface (CLI + Obsidian sidebar plugin).
#
# Hardware profiles (pick one):
#   CPU / generic:     docker compose up -d                         (this file)
#   Intel Arc iGPU:    docker compose -f docker-compose.yml -f docker-compose.arc.yml up -d
#   NVIDIA GPU:        docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up -d
#
#   See docs/hardware/ for requirements, tuning, and troubleshooting.
#
# Quick start:
#   1. ./install.sh                      # auto-detects GPU, creates .env, starts stack
#   -- or manually:
#   1. cp .env.example .env              # then edit .env with your settings
#   2. scripts/generate-olla-config.sh   # generate proxy/olla.yaml
#   3. docker compose up -d              # add -f overlay for your GPU
#
# Service URLs:
#   Olla status   http://localhost:40114/internal/status/endpoints
#   Retriever     http://localhost:42000/health
#   LiteLLM UI    http://localhost:4000/ui      (admin / LITELLM_MASTER_KEY)
###############################################################################

services:

  # ─── Ollama — local LLM inference ─────────────────────────────────────────
  # Default: standard Ollama image (CPU / CUDA).
  # For GPU acceleration, add a hardware overlay:
  #   Intel Arc:  -f docker-compose.arc.yml
  #   NVIDIA:     -f docker-compose.nvidia.yml
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=app://obsidian.md*
      - OLLAMA_KEEP_ALIVE=-1
    volumes:
      - ${OLLAMA_DATA:-/home/user/.ollama}:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    shm_size: '${OLLAMA_SHM_SIZE:-2gb}'
    mem_limit: '${OLLAMA_MEM_LIMIT:-8g}'
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/11434 2>/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - ai-net

  # ─── LiteLLM — cloud API gateway ──────────────────────────────────────────
  # Exposes Claude, Gemini (and optionally OpenAI) via a single
  # OpenAI-compatible endpoint. Olla routes cloud model requests here.
  # Admin UI: http://localhost:4000/ui
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    restart: unless-stopped
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./proxy/litellm_config.yaml:/app/config.yaml:ro
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-not-set}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set in .env — run scripts/generate-keys.sh}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveness?key=${LITELLM_MASTER_KEY:-sk-local-admin}')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - ai-net

  # ─── Olla — LLM proxy & load balancer ─────────────────────────────────────
  # Single unified endpoint for all models — local Ollama + cloud via LiteLLM.
  # LAN node config is NOT baked in here — declare extra nodes as OLLAMA_REMOTE_*
  # variables in your .env, then run scripts/generate-olla-config.sh to produce
  # proxy/olla.yaml before bringing up the stack.
  # Status: http://localhost:40114/internal/status/endpoints
  olla:
    image: ghcr.io/thushan/olla:latest
    container_name: olla
    restart: unless-stopped
    ports:
      - "${OLLA_PORT:-40114}:40114"
    volumes:
      - ./proxy/olla.yaml:/app/config.yaml:ro   # generated by scripts/generate-olla-config.sh — in .gitignore
      - olla-logs:/app/logs
    depends_on:
      ollama:
        condition: service_healthy
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:40114/internal/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ai-net

  # ─── Retriever — Obsidian vault RAG ────────────────────────────────────────
  # Lightweight replacement for Khoj + PostgreSQL.
  # Uses sqlite-vec for vector storage, FTS5 for keyword search,
  # and watchdog for live vault indexing.
  # Hybrid search: BM25 (FTS5) + vector similarity, fused via RRF.
  # Embeddings via Olla → ollama (nomic-embed-text).
  # API-only: no web UI. Intended for use as an OpenCode tool.
  retriever:
    build: ./retriever
    container_name: retriever
    restart: unless-stopped
    ports:
      - "${RETRIEVER_PORT:-42000}:42000"
    volumes:
      - retriever-data:/data
      - ${RETRIEVER_VAULT_PATH:-/home/user/obsidian}:/vault:ro
    environment:
      - OLLA_URL=http://olla:40114
      - EMBED_MODEL=${RETRIEVER_EMBED_MODEL:-nomic-embed-text}
      - CHUNK_SIZE=${RETRIEVER_CHUNK_SIZE:-512}
      - CHUNK_OVERLAP=${RETRIEVER_CHUNK_OVERLAP:-64}
      - DB_PATH=/data/retriever.db
      - VAULT_PATH=/vault
    depends_on:
      olla:
        condition: service_healthy
    networks:
      - ai-net

  # ─── Apostle — cluster brain + observable dashboard ───────────────────────
  # Introspects hardware, discovers peers, manages model inventory.
  # Serves live D3.js cluster dashboard and JSON status API.
  # Dashboard: http://localhost:40116/ui
  # Status:    http://localhost:40116/apostle/v1/status
  # Cluster:   http://localhost:40116/apostle/v1/cluster
  apostle:
    build:
      context: .
      dockerfile: scripts/Dockerfile.apostle
    container_name: apostle
    restart: unless-stopped
    ports:
      - "${APOSTLE_PORT:-40116}:40116"
    volumes:
      - ./.env:/app/.env:ro
    environment:
      - OLLAMA_HOST=ollama
      - APOSTLE_PORT=40116
      - APOSTLE_ENV_FILE=/app/.env
    depends_on:
      olla:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:40116/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - ai-net

  # ── Smart Model Router — content-based model selection ──────────────────
  # Sits between OpenCode and Olla. Classifies queries and auto-selects the
  # best local model. Cloud model requests pass through unchanged.
  # Point OpenCode's Olla provider at http://localhost:40115.
  # Gestalt UI: http://localhost:40115/gestalt/ui
  router:
    build: ./router
    container_name: router
    restart: unless-stopped
    ports:
      - "40115:40115"
    environment:
      - OLLA_URL=http://olla:40114
      - LISTEN_HOST=0.0.0.0
      - LISTEN_PORT=40115
    depends_on:
      olla:
        condition: service_healthy
    networks:
      - ai-net

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  olla-logs:
  retriever-data:

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  ai-net:
