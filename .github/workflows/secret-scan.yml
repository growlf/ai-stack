name: Secret scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for diff scan)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uses the project's .gitleaks.toml at repo root for the rule set:
          # default upstream rules + project-specific patterns (Big Pickle,
          # LiteLLM master key, NetBird setup key) + doc/example allowlist.
          GITLEAKS_CONFIG: .gitleaks.toml
